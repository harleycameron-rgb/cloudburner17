name: Zero-data validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  zero-data:
    name: Zero-data (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENROUTER_API_KEY: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check -c backend/constraints-ci.txt -r backend/requirements.txt "httpx==0.28.1"
      - name: Test zero-data enforcement and deterministic harmony
        run: python -B -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/zero-data-tests.log"
      - name: Run supervised pipeline with zero-data guard
        run: python -B src/run_supervised_build.py
      - name: Verify autonomous cycle and reproducible sentinel
        run: PYTHONPATH=src python -B -c "from autonomy import self_verify; assert self_verify()"
      - name: Exercise package module entry points
        run: |
          python -B -m src.stabiliser
          python -B -m src.harmony
          python -B -m src.autonomy
          python -B -m src.agent_core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: zero-data-tests-${{ matrix.python-version }}
          path: ${{ runner.temp }}/zero-data-tests.log
          retention-days: 7
