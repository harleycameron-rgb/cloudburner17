name: Zero-data validation

on:
  push:
  pull_request:

jobs:
  zero-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test zero-data enforcement and deterministic harmony
        run: python -B -m unittest discover -s tests -v
      - name: Run supervised pipeline with zero-data guard
        run: python -B src/run_supervised_build.py
      - name: Verify autonomous cycle and reproducible sentinel
        run: PYTHONPATH=src python -B -c "from autonomy import self_verify; assert self_verify()"
      - name: Exercise package module entry points
        run: |
          python -B -m src.stabiliser
          python -B -m src.harmony
          python -B -m src.autonomy
          python -B -m src.agent_core
      - name: Build and smoke-test container
        run: |
          docker build -t invariant-engine -f backend/Dockerfile .
          docker run --rm -d --name cloudburner17-smoke -p 18000:8000 invariant-engine
          trap 'docker stop cloudburner17-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if response=$(curl --silent --show-error --fail -X POST http://localhost:18000/supervise/burn/y 2>/dev/null); then
              echo "$response" | grep -q '"status":"completed"'
              exit 0
            fi
            sleep 1
          done
          exit 1
