name: Multi-LLM council offline tests

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: council-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  council-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENROUTER_API_KEY: ""
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check -c backend/constraints-ci.txt "httpx==0.28.1"

      - name: Run council tests with socket connections blocked
        run: |
          python -B - <<'PY'
          import socket
          import unittest
          from unittest.mock import patch

          def deny_network(*args, **kwargs):
              raise AssertionError("Network connections are forbidden in council tests")

          with patch.object(socket.socket, "connect", deny_network), \
               patch.object(socket.socket, "connect_ex", deny_network), \
               patch.object(socket, "create_connection", deny_network):
              suite = unittest.defaultTestLoader.discover(
                  "tests", pattern="test_multi_llm_council.py"
              )
              if suite.countTestCases() != 7:
                  raise AssertionError("Expected exactly seven council tests")
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
