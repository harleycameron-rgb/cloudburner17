name: Manually approved Vercel deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    concurrency:
      group: vercel-approved-deployments
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_DEPLOY_ENABLED: ${{ vars.VERCEL_DEPLOY_ENABLED }}
      VERCEL_GIT_INTEGRATION_DISABLED: ${{ vars.VERCEL_GIT_INTEGRATION_DISABLED }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Initialize nonsecret deployment verification manifest
        run: python -B .github/scripts/vercel_checks.py manifest-init "$RUNNER_TEMP/deployment-verification.json"
      - name: Verify source, project, and app surface
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if python -B .github/scripts/vercel_checks.py verify; then
            python -B .github/scripts/vercel_checks.py manifest-check "$RUNNER_TEMP/deployment-verification.json" preflight passed
          else
            python -B .github/scripts/vercel_checks.py manifest-check "$RUNNER_TEMP/deployment-verification.json" preflight failed
            exit 1
          fi
      - name: Install explicitly versioned deployment client
        run: |
          if npm install --global vercel@64.7.0 --ignore-scripts --no-audit --no-fund; then
            python -B .github/scripts/vercel_checks.py manifest-check "$RUNNER_TEMP/deployment-verification.json" cli_install passed
          else
            python -B .github/scripts/vercel_checks.py manifest-check "$RUNNER_TEMP/deployment-verification.json" cli_install failed
            exit 1
          fi
      - name: Pull approved target configuration
        working-directory: backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: "1"
        run: |
          if vercel pull --yes --environment="$DEPLOY_ENVIRONMENT" --token="$VERCEL_TOKEN"; then
            python -B ../.github/scripts/vercel_checks.py manifest-check "$RUNNER_TEMP/deployment-verification.json" vercel_pull passed
          else
            python -B ../.github/scripts/vercel_checks.py manifest-check "$RUNNER_TEMP/deployment-verification.json" vercel_pull failed
            exit 1
          fi
      - name: Build approved project
        working-directory: backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: "1"
        run: |
          args=()
          if [ "$DEPLOY_ENVIRONMENT" = production ]; then args+=(--prod); fi
          if vercel build "${args[@]}" --token="$VERCEL_TOKEN"; then
            python -B ../.github/scripts/vercel_checks.py manifest-check "$RUNNER_TEMP/deployment-verification.json" vercel_build passed
          else
            python -B ../.github/scripts/vercel_checks.py manifest-check "$RUNNER_TEMP/deployment-verification.json" vercel_build failed
            exit 1
          fi
      - name: Deploy with explicit source identity metadata
        working-directory: backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: "1"
        run: |
          args=()
          if [ "$DEPLOY_ENVIRONMENT" = production ]; then args+=(--prod); fi
          if vercel deploy --prebuilt "${args[@]}" --yes --token="$VERCEL_TOKEN" \
            --meta "ciSourceRevision=$GITHUB_SHA" \
            --meta "ciRepository=$GITHUB_REPOSITORY" \
            --meta "ciProjectId=$VERCEL_PROJECT_ID" \
            --meta "ciTeamId=$VERCEL_ORG_ID" \
            --meta "ciTarget=$DEPLOY_ENVIRONMENT" \
            --meta "ciWorkflowRunId=$GITHUB_RUN_ID" \
            --meta "ciWorkflowRunAttempt=$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/deployment-url.txt" \
            && test -s "$RUNNER_TEMP/deployment-url.txt"; then
            python -B ../.github/scripts/vercel_checks.py manifest-check "$RUNNER_TEMP/deployment-verification.json" deployment passed
          else
            python -B ../.github/scripts/vercel_checks.py manifest-check "$RUNNER_TEMP/deployment-verification.json" deployment failed
            exit 1
          fi
      - name: Verify READY and immutable deployment identity
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if python -B .github/scripts/vercel_checks.py ready "$(cat "$RUNNER_TEMP/deployment-url.txt")" "$RUNNER_TEMP/deployment-verification.json"; then
            python -B .github/scripts/vercel_checks.py manifest-check "$RUNNER_TEMP/deployment-verification.json" ready passed
          else
            python -B .github/scripts/vercel_checks.py manifest-check "$RUNNER_TEMP/deployment-verification.json" ready failed
            exit 1
          fi
      - name: Read-only runtime and accessibility checks
        run: |
          if python -B .github/scripts/vercel_checks.py smoke "$(cat "$RUNNER_TEMP/deployment-url.txt")"; then
            python -B .github/scripts/vercel_checks.py manifest-check "$RUNNER_TEMP/deployment-verification.json" smoke passed
          else
            python -B .github/scripts/vercel_checks.py manifest-check "$RUNNER_TEMP/deployment-verification.json" smoke failed
            exit 1
          fi
      - name: Retain nonsecret deployment verification manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vercel-${{ inputs.environment }}-verification
          path: ${{ runner.temp }}/deployment-verification.json
          retention-days: 30
