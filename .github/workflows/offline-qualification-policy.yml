name: Offline qualification policy tests
on:
  pull_request:
    paths:
      - 'research/qualification_contract.py'
      - 'research/QUALIFICATION_POLICY.md'
      - 'tests/test_qualification_contract.py'
      - '.github/workflows/offline-qualification-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-face-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Execute isolated policy tests without bytecode writes
        run: python3 -B -m unittest discover -s tests -p 'test_qualification_contract.py' -v
