name: CLOUDBURNER17 Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deployment:
        description: "Explicit opt-in (requires approved environment and verified mapping)"
        type: choice
        default: none
        options: [none, preview, production]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ inputs.deployment || 'ci' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install from the dependency-free manifest (no lockfile exists)
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: JavaScript tests
        run: npm test 2>&1 | tee "$RUNNER_TEMP/javascript-tests.log"
      - name: TypeScript tests (Node 22 supports type stripping)
        run: npm run test:typescript 2>&1 | tee "$RUNNER_TEMP/typescript-tests.log"
      - name: Check served JavaScript syntax (no frontend build script exists)
        run: |
          node --check frontend/app.js
          node --check backend/scandoc/app.js
          node --check backend/scandoc/model.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: javascript-test-results
          path: |
            ${{ runner.temp }}/javascript-tests.log
            ${{ runner.temp }}/typescript-tests.log
          retention-days: 7

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENROUTER_API_KEY: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install backend and existing test frameworks
        run: |
          python -m pip install --disable-pip-version-check -c backend/constraints-ci.txt -r backend/requirements.txt httpx pytest
          python -m pip check
      - name: Backend and deployment guard tests
        run: |
          python -B -m pytest -p no:cacheprovider backend/tests tests/test_ci_deployment.py --junitxml="$RUNNER_TEMP/backend-tests.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: backend-test-results
          path: ${{ runner.temp }}/backend-tests.xml
          retention-days: 7

  zero-data:
    uses: ./.github/workflows/zero-data.yml
  council:
    uses: ./.github/workflows/multi-llm-council-tests.yml
  container:
    uses: ./.github/workflows/backend-container.yml

  ci:
    name: Required CI
    if: ${{ always() }}
    needs: [javascript, backend-tests, zero-data, council, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed (including reusable workflows)
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          if len(results) != 5 or any(result != "success" for result in results):
              raise SystemExit(f"Required CI did not succeed: {results}")
          PY

  deploy-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment == 'preview' && github.ref == 'refs/heads/main' }}
    needs: ci
    uses: ./.github/workflows/vercel-deploy.yml
    with:
      environment: preview
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-production:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment == 'production' && github.ref == 'refs/heads/main' }}
    needs: ci
    uses: ./.github/workflows/vercel-deploy.yml
    with:
      environment: production
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
