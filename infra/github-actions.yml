name: Zero-data validation

on:
  push:
  pull_request:

jobs:
  zero-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test zero-data enforcement and deterministic harmony
        run: python -B -m unittest discover -s tests -v
      - name: Run supervised pipeline with zero-data guard
        run: python -B src/run_supervised_build.py
